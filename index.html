<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocular Disease Classification</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-image: url('your-eye-image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .upload-section {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-bottom: 30px;
        }
        .upload-box {
            width: 300px;
            height: 200px;
            border: 3px dashed #3498db;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }
        .upload-box:hover {
            background-color: #e8f4fd;
            transform: scale(1.02);
        }
        .upload-box p {
            font-size: 18px;
            color: #3498db;
        }
        #imageUpload {
            display: none;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        #submitBtn {
            background-color: #3498db;
            color: white;
        }
        #submitBtn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        #clearBtn {
            background-color: #e74c3c;
            color: white;
        }
        #clearBtn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        .image-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        .image-box {
            width: 48%;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .image-box h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .image-box img {
            max-width: 100%;
            border-radius: 10px;
        }
        .prediction-box {
            background-color: #e8f4fd;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
            text-align: center;
        }
        .prediction-box p {
            margin: 10px 0;
            font-size: 18px;
        }
        .loading {
            text-align: center;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ocular Disease Classification</h1>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <p>Click to upload an image</p>
            </div>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <div style="text-align: center;">
            <button id="submitBtn" class="btn" style="display:none;">Analyze Image</button>
            <button id="clearBtn" class="btn" style="display:none;">Clear</button>
        </div>

        <div class="loading">
            <p>Processing image...</p>
        </div>

        <div id="result"></div>
    </div>

    <script>
        $(document).ready(function() {
            $('#uploadBox').click(function() {
                $('#imageUpload').click();
            });

            $('#imageUpload').change(function() {
                var file = this.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        $('#uploadBox').html('<img src="' + e.target.result + '" style="max-width:100%; max-height:200px; border-radius:10px;">');
                        $('#submitBtn, #clearBtn').show();
                    }
                    reader.readAsDataURL(file);
                }
            });

            $('#clearBtn').click(function() {
                $('#imageUpload').val('');
                $('#uploadBox').html('<p>Click to upload an image</p>');
                $('#result').html('');
                $('#submitBtn, #clearBtn').hide();
            });

            $('#submitBtn').click(function() {
                var formData = new FormData();
                formData.append('file', $('#imageUpload')[0].files[0]);

                $('.loading').show();
                $('#result').html('');

                $.ajax({
                    url: '/',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(data) {
                        $('.loading').hide();
                        $('#result').html(
                            '<div class="image-container">' +
                                '<div class="image-box">' +
                                    '<h3>Original Image</h3>' +
                                    '<img src="data:image/png;base64,' + data.original_image + '" alt="Original Image">' +
                                '</div>' +
                                '<div class="image-box">' +
                                    '<h3>CLAHE Processed Image</h3>' +
                                    '<img src="data:image/png;base64,' + data.clahe_image + '" alt="CLAHE Processed Image">' +
                                '</div>' +
                            '</div>' +
                            '<div class="prediction-box">' +
                                '<p><strong>Predicted Class:</strong> ' + data.predicted_class + '</p>' +
                                '<p><strong>Confidence:</strong> ' + data.confidence + '</p>' +
                            '</div>'
                        );
                    },
                    error: function() {
                        $('.loading').hide();
                        $('#result').html('<p>An error occurred. Please try again.</p>');
                    }
                });
            });
        });
    </script>
</body>
</html>
